<div class="edit-user-container">

  <!-- Business Edit Form -->
  <form *ngIf="roleID === 3" [formGroup]="editBusinessForm" (ngSubmit)="submitBusinessForm()">
    <h1>Edit Business User</h1>
    <div class="form-group">
      <label>Business Name</label>
      <input type="text" formControlName="businessName" placeholder="Enter business name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Enter email" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" placeholder="Business description"></textarea>
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" formControlName="location" placeholder="Enter location" />
    </div>
    <button type="submit">Update Business</button>
  </form>

  <!-- Customer Edit Form -->
  <form *ngIf="roleID === 4" [formGroup]="editCustomerForm" (ngSubmit)="submitCustomerForm()">
    <h1>Edit Customer User</h1>
    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" placeholder="Enter your name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Enter email" />
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" formControlName="location" placeholder="Enter location" />
    </div>
    <button type="submit">Update Customer</button>
  </form>
</div>
